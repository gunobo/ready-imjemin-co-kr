services:
  backend:
    build: ./backend
    container_name: ready-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/ready.db
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_INITIAL_USERNAME: ${ADMIN_INITIAL_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CORS_ORIGINS: '["https://ready.imjemin.co.kr"]'
    volumes:
      - ready_db:/data
    ports:
      - "8008:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: ready-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5105:80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ready-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend

volumes:
  ready_db:
